name: nurture-oe
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - scipy
  - xarray
  - h5py
  - netcdf4
  - pandas
  - pyproj      # geoid undulation (follow-up §A.8(5a))
  - proj-data   # EGM2008 / EGM96 geoid grids
  - matplotlib
  - ultraplot
  - pyyaml
  - pytest
  - jupyterlab
  - ipykernel
  - pip
